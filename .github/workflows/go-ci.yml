name: GO CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs_on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up GO
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go tests ./...